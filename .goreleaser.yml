# GoReleaser config for GoImager.
# Build the binary straight from source on every platform supported by GoReleaser.
# Docker image publishing is handled separately in `.github/workflows/release.yml`
# (uses the project's existing `Dockerfile`, which bundles the optimizer CLIs).
version: 2

project_name: goimager

before:
  hooks:
    - go mod tidy

builds:
  - id: server
    main: ./cmd/server
    binary: goimager
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/DulanDev/GoImager/internal/handler.Version={{.Version}}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
  - id: gensig
    main: ./cmd/gensig
    binary: gensig
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/DulanDev/GoImager/internal/handler.Version={{.Version}}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        format: zip
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-dev"

changelog:
  use: git
  sort: desc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^Merge pull request"
      - "^Merge branch"

release:
  draft: true
  prerelease: auto
  name_template: "{{ .Tag }}"

brew_unsupported: true
nix: []